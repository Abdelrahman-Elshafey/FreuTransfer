# The production stack (docs/deploy.md). Secrets come from .env.prod, never committed
# (template: .env.prod.example). On the server:
#   docker compose -f compose.prod.yml --env-file .env.prod up -d --wait
#
#   Cloudflare ──tunnel──▶ web (nginx) ─┬─ /v1/*, /health ─▶ api ──▶ db
#   (outbound only)                      └─ everything else: the built page
#
# No service publishes a port (ADR 0004): `tunnel` dials out to Cloudflare, everything else is
# reachable only inside this project's private network, by service name (api:3000, db:5432).
# Order on every start: db healthy → migrate (schema) → seed (provider data) → api → web.
# Backups (docs/deploy.md, "Backups"): `backup` dumps the database every 24 hours, `offsite`
# copies the dumps to Cloudflare R2 every 6 hours. `collect` fetches the reference rates every
# hour (ADR 0007).

# Its own project name: never mixes with the dev database (docker-compose.yml, project
# "freutransfer") or UrConnections' containers on the server.
name: freutransfer-prod

# Image names. Locally: built here, e.g. freutransfer-api:latest. On the server .env.prod sets
# IMAGE_PREFIX=ghcr.io/<owner>/ and IMAGE_TAG to a commit, so it pulls what CI built.
x-api-image: &api-image ${IMAGE_PREFIX:-}freutransfer-api:${IMAGE_TAG:-latest}
x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile
  target: api
# ${VAR:?message}: compose refuses to start and prints the message if the variable is unset.
x-database-url: &database-url postgresql://freu:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}@db:5432/freu_transfer

services:
  db:
    # Same version as the dev database (deploy/versions.test.ts keeps them equal).
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: freu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: freu_transfer
      TZ: UTC
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/, so mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freu -d freu_transfer"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-off: applies new migrations, then exits. The seed and the API wait for it to succeed,
  # so they never run against an outdated schema.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    image: ${IMAGE_PREFIX:-}freutransfer-migrate:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy

  # One-off: loads the reviewed provider data (verified entries only; already stored rows are
  # left alone; a history row edited in the files or deleted from them stops it:
  # packages/db/src/seed.ts, ADR 0009). Data changes in git therefore reach production with the
  # next deploy.
  seed:
    build: *api-build
    image: *api-image
    command: ["node", "packages/db/src/seed-cli.ts"]
    restart: "no"
    environment:
      DATABASE_URL: *database-url
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The reference rates from Frankfurter: one run now, then every hour (ADR 0007;
  # packages/collectors). Each run asks for the last 10 days, so a missed hour or day repairs
  # itself. A failed run is recorded in collector_runs and retried the next hour.
  collect:
    build: *api-build
    image: *api-image
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    # Each round starts Node anew, so it always runs the code of the current image.
    command:
      [
        "while true; do node packages/collectors/src/collect-cli.ts || echo 'collect: next try in 1 hour' >&2; sleep 3600; done",
      ]
    environment:
      DATABASE_URL: *database-url
    # The image's health check asks the API on port 3000, which doesn't run here: without this,
    # the container counts as unhealthy and every deploy (`up --wait`) fails.
    healthcheck:
      disable: true
    depends_on:
      # The corridors (what to collect) come from the seed.
      seed:
        condition: service_completed_successfully

  api:
    build: *api-build
    image: *api-image
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
    depends_on:
      seed:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ${IMAGE_PREFIX:-}freutransfer-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  # Cloudflare Tunnel (ADR 0004). Opt-in through a profile: it runs only where .env.prod sets
  # COMPOSE_PROFILES=tunnel (the server), so the stack also starts on a computer without a token.
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # cloudflared reads the token from this variable. `:-` and not `:?`: compose checks every
      # service's variables, even those of an inactive profile.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy

  # A database dump now, then every 24 hours (deploy/backup/backup.sh), kept 14 days in the
  # `backups` volume. scripts/deploy.sh also runs one before every deploy:
  #   docker compose ... run --rm --no-deps backup "sh /scripts/backup.sh"
  backup:
    # The database's own image: pg_dump is exactly the server's version (deploy/versions.test.ts).
    image: postgres:18.6
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    # Each round starts the script anew, so a deploy that changes it takes effect without a
    # restart. A failed round is logged and retried the next day; the loop keeps running.
    command:
      [
        "while true; do sh /scripts/backup.sh || echo 'backup: next try in 24 hours' >&2; sleep 86400; done",
      ]
    environment:
      PGHOST: db
      PGUSER: freu
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      PGDATABASE: freu_transfer
      BACKUP_KEEP_DAYS: 14
    volumes:
      # A folder, not single files: a file mounted alone keeps showing its old version after a
      # `git checkout` replaces it (found on UrConnections); a folder shows the current files.
      - ./deploy/backup:/scripts:ro
      - backups:/backups
    depends_on:
      # After the data is in: a first dump of a database without its schema would be useless.
      seed:
        condition: service_completed_successfully

  # Copies new dumps to the Cloudflare R2 bucket every 6 hours (deploy/backup/offsite.sh), kept
  # 30 days there. Opt-in through a profile: it runs only where .env.prod sets
  # COMPOSE_PROFILES=tunnel,offsite (the server), so the stack also starts without a bucket.
  offsite:
    image: rclone/rclone:1.75.2
    profiles: ["offsite"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      [
        "while true; do sh /scripts/offsite.sh || echo 'offsite: next try in 6 hours' >&2; sleep 21600; done",
      ]
    environment:
      OFFSITE_S3_BUCKET: ${OFFSITE_S3_BUCKET:-}
      OFFSITE_KEEP_DAYS: 30
      # rclone builds its remote "r2" from these variables (no config file).
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: ${OFFSITE_S3_ENDPOINT:-}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${OFFSITE_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${OFFSITE_S3_SECRET_ACCESS_KEY:-}
      # The key may only touch its own bucket, so rclone must not try to list or create buckets.
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    volumes:
      - ./deploy/backup:/scripts:ro
      - backups:/backups:ro

volumes:
  pgdata:
  backups:
