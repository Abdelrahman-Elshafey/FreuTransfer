# Security headers for every response (included in each `location` of nginx.conf: a location with
# its own add_header would otherwise drop headers set at server level). `always`: also on errors.
#
# CSP: everything comes from this site (the built JS, CSS and fonts; the API on the same origin).
# React sets style properties through the DOM, which CSP doesn't block, so no 'unsafe-inline'.
# Fonts also from data: URIs: Vite inlines font files under 4 kB into the CSS (a font can't run
# code; found by loading the built page with this policy, 2026-11-18).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# HTTPS only for a year (Cloudflare serves HTTPS; this host only, no includeSubDomains).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
# Links to providers get our origin only, never the page path.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
