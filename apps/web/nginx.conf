# The site's one entry point (docs/adr/0004): the Cloudflare tunnel sends every request here.
#   /v1/*, /health  → the API (same paths as the Vite dev proxy, apps/web/vite.config.ts)
#   everything else → the built page
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # Docker's internal DNS. With the address in a variable, nginx looks "api" up per request
    # (cached 10 s) instead of once at start: it starts even before the API, and follows the API
    # to its new address after a redeploy.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:3000;

    location /v1/ {
        proxy_pass $api;
    }
    location = /health {
        proxy_pass $api;
    }

    # Vite puts a content hash in these file names, so a new build gets new names:
    # browsers may keep them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The page itself: always ask for the newest version (it names the current assets).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
