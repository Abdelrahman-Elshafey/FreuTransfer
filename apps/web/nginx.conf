# The site's one entry point (docs/adr/0004): the Cloudflare tunnel sends every request here.
#   /v1/*, /health  → the API (same paths as the Vite dev proxy, apps/web/vite.config.ts)
#   /en/ /de/ /fr/ /it/…  → the page (it reads its language from the path, docs/adr/0005)
#   everything else → the built files
# Security headers: security-headers.conf, included in every location (see there why).

# Requests per visitor to the API: 10 a second, bursts of 20 (one comparison makes 7 at once).
# Keyed by the visitor's address from Cloudflare (set_real_ip_from below), not the tunnel's.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # Only the tunnel (cloudflared, on the Docker network) reaches nginx: no port is published
    # (ADR 0004). So the visitor's address Cloudflare sends in CF-Connecting-IP can be trusted
    # from private addresses, and becomes $remote_addr (for the limit and the logs).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    # Docker's internal DNS. With the address in a variable, nginx looks "api" up per request
    # (cached 10 s) instead of once at start: it starts even before the API, and follows the API
    # to its new address after a redeploy.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:3000;

    location /v1/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        error_page 429 = @too_many;
        include /etc/nginx/security-headers.conf;
        proxy_pass $api;
    }
    location = /health {
        include /etc/nginx/security-headers.conf;
        proxy_pass $api;
    }
    # Over the limit: an RFC 9457 problem like the API's own errors (apps/api/src/problem.ts).
    location @too_many {
        include /etc/nginx/security-headers.conf;
        default_type application/problem+json;
        return 429 '{"type":"about:blank","title":"Too Many Requests","status":429}';
    }

    # Vite puts a content hash in these file names, so a new build gets new names:
    # browsers may keep them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Every page in each language is the same built page: it reads the language and the page from
    # the path. The codes are LOCALE_CODES in apps/web/src/i18n/locales.ts (nginx.integration.test.ts
    # checks each one); an unknown first segment (/es/) stays a 404.
    location ~ ^/(en|de|fr|it)(/|$) {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files /index.html =404;
    }

    # The page itself: always ask for the newest version (it names the current assets).
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ =404;
    }
}
